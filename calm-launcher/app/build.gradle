plugins { id 'com.android.application' }

android {
    namespace 'app.calmlauncher'
    compileSdk 35
    defaultConfig {
        applicationId 'app.calmlauncher'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
